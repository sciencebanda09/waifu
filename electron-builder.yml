appId: com.codewaifu
productName: CodeWaifu
directories:
  output: dist
files:
  - main.js
  - preload.js
  - renderer/**
  - assets/**
  - backend/**
  - node_modules/**
extraResources:
  - from: backend
    to: backend
win:
  target: nsis
  icon: assets/icon.ico
mac:
  target: dmg
  icon: assets/icon.icns
linux:
  target: AppImage
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
