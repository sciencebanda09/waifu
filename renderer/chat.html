<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CodeWaifu</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { width: 380px; height: 520px; background: #0a0a0f; overflow: hidden; margin: 0; }
    #skill-panel {
      position: absolute; top: 0; right: -320px; width: 320px; height: 100%;
      background: #0d0d14; border-left: 1px solid rgba(255,255,255,0.06);
      transition: right 0.3s ease; overflow-y: auto; padding: 12px; z-index: 10;
    }
    #skill-panel.open { right: 0; }
    .skill-item {
      padding: 8px 10px; margin-bottom: 6px; border-radius: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
    }
    .skill-item.unlocked { border-color: rgba(0,255,204,0.3); }
    .skill-item .skill-name { color: rgba(255,255,255,0.8); font-size: 12px; margin-bottom: 2px; }
    .skill-item .skill-meta { color: rgba(255,255,255,0.3); font-size: 10px; }
    .skill-item .skill-lock { color: rgba(255,80,80,0.6); font-size: 10px; }
    #skill-close {
      font-size: 10px; color: rgba(255,255,255,0.3); cursor: pointer;
      padding: 4px 0 10px; letter-spacing: 1px;
    }
    #skill-close:hover { color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div id="chat-window" style="position:relative;width:380px;height:520px;overflow:hidden">
    <div id="chat-header">
      <span id="header-name">WAIFU</span>
      &nbsp;·&nbsp;
      <span id="header-mood" style="color:#888">mood: bored</span>
      &nbsp;·&nbsp;
      <span id="header-level" style="color:rgba(255,255,255,0.25)">lv 1</span>
    </div>
    <div id="chat-messages"></div>
    <div class="command-pills">
      <span class="pill" data-cmd="/feed">/feed</span>
      <span class="pill" data-cmd="/skills">/skills</span>
      <span class="pill" data-cmd="/status">/status</span>
      <span class="pill" data-cmd="/diary">/diary</span>
      <span class="pill" data-cmd="/roast">/roast</span>
    </div>
    <div id="chat-input-area">
      <textarea id="chat-input" rows="2" placeholder="say something..."></textarea>
    </div>

    <!-- Skill panel -->
    <div id="skill-panel">
      <div id="skill-close">← CLOSE</div>
      <div id="skill-list"></div>
    </div>
  </div>
  <script src="chat.js"></script>
</body>
</html>
